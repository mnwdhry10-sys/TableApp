name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.4"
          pip install buildozer

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee build.log

      - name: Show generated files
        if: always()
        run: |
          echo "===== BIN DIRECTORY ====="
          ls -lah bin/ || true

          echo "===== ALL APK FILES ====="
          find . -name "*.apk" -type f -print || true

      - name: Show error summary
        if: failure()
        run: |
          echo "========================================"
          echo "           ERROR SUMMARY"
          echo "========================================"

          echo "===== ERROR LINES ====="
          grep -i -E "error:|error |exception|traceback|failed|fatal|cannot|no such file|command failed" build.log | tail -100 || true

          echo "========================================"
          echo "        LAST 150 LINES OF LOG"
          echo "========================================"
          tail -150 build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TableApp-APK
          path: "**/*.apk"
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TableApp-Build-Log
          path: build.log
          if-no-files-found: warn
